<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محوّل التاريخ الهجري</title>
<style>
  :root { --bg:#f7f5ef; --card:#fff; --fg:#1f2a24; --muted:#5d6b63; --accent:#1f7a4d; --border:#dcd8cc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141916; --card:#1d241f; --fg:#e8ece9; --muted:#9aa89f; --accent:#4cc38a; --border:#2f3a33; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif; line-height:1.6; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:1.8rem; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .today { font-size:1.3rem; font-weight:600; color:var(--accent); margin-bottom:24px; }
  section { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:1.1rem; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input, select { font:inherit; padding:8px 10px; border:1px solid var(--border); border-radius:8px;
                  background:var(--bg); color:var(--fg); min-width:0; }
  input[type=date] { flex:1; }
  input[type=number] { width:90px; }
  select { flex:1; }
  .out { margin-top:12px; font-size:1.15rem; font-weight:600; min-height:1.6em; }
  .err { color:#c0392b; }
  footer { color:var(--muted); font-size:.85rem; text-align:center; margin-top:24px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>محوّل التاريخ الهجري</h1>
  <p class="sub">تحويل بين التقويم الهجري (أم القرى) والتقويم الميلادي</p>
  <div class="today" id="today"></div>

  <section>
    <h2>من الميلادي إلى الهجري</h2>
    <div class="row"><input type="date" id="greg" aria-label="التاريخ الميلادي"></div>
    <div class="out" id="toHijri"></div>
  </section>

  <section>
    <h2>من الهجري إلى الميلادي</h2>
    <div class="row">
      <input type="number" id="hd" min="1" max="30" value="1" aria-label="اليوم">
      <select id="hm" aria-label="الشهر"></select>
      <input type="number" id="hy" min="1343" max="1500" value="1448" aria-label="السنة">
    </div>
    <div class="out" id="toGreg"></div>
  </section>

  <footer>
    <a href="https://github.com/ywsfalhajby08-star/hijri-date">hijri-date</a> · رخصة MIT
  </footer>
</main>
<script>
const MONTHS = ["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة",
                "رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
const GREG_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو",
                     "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const fmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",
  { day:"numeric", month:"numeric", year:"numeric", timeZone:"UTC" });

function toHijri(date) {            // date: Date at UTC midnight
  const p = {};
  for (const { type, value } of fmt.formatToParts(date)) p[type] = value;
  return { y: parseInt(p.year), m: parseInt(p.month), d: parseInt(p.day) };
}

function toGregorian(y, m, d) {     // search near the approximate date
  const days = Math.round((y - 1) * 354.367 + (m - 1) * 29.53 + d - 1);
  const approx = Date.UTC(622, 6, 16) + days * 864e5;
  for (let off = -40; off <= 40; off++) {
    const t = new Date(approx + off * 864e5);
    const h = toHijri(t);
    if (h.y === y && h.m === m && h.d === d) return t;
  }
  return null;
}

const hijriText = h => `${h.d} ${MONTHS[h.m - 1]} ${h.y} هـ`;
const gregText = t => `${DAYS[t.getUTCDay()]} ${t.getUTCDate()} ${GREG_MONTHS[t.getUTCMonth()]} ${t.getUTCFullYear()} م`;

const now = new Date();
const todayUTC = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
const th = toHijri(todayUTC);
document.getElementById("today").textContent = `اليوم: ${DAYS[todayUTC.getUTCDay()]} ${hijriText(th)}`;

const greg = document.getElementById("greg");
greg.value = todayUTC.toISOString().slice(0, 10);
function updHijri() {
  const out = document.getElementById("toHijri");
  if (!greg.value) { out.textContent = ""; return; }
  const [y, m, d] = greg.value.split("-").map(Number);
  out.textContent = hijriText(toHijri(new Date(Date.UTC(y, m - 1, d))));
}
greg.addEventListener("input", updHijri);

const hm = document.getElementById("hm");
MONTHS.forEach((name, i) => hm.add(new Option(name, i + 1)));
document.getElementById("hd").value = th.d;
hm.value = th.m;
document.getElementById("hy").value = th.y;
function updGreg() {
  const out = document.getElementById("toGreg");
  const y = +document.getElementById("hy").value, m = +hm.value, d = +document.getElementById("hd").value;
  const t = (y && d) ? toGregorian(y, m, d) : null;
  out.classList.toggle("err", !t);
  out.textContent = t ? `${gregText(t)} (${t.toISOString().slice(0, 10)})` : "تاريخ هجري غير صالح";
}
["hd", "hm", "hy"].forEach(id => document.getElementById(id).addEventListener("input", updGreg));

updHijri(); updGreg();
</script>
</body>
</html>
